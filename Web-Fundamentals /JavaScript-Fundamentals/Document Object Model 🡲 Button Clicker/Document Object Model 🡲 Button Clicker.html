<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Document Object Model 🡲 Button Clicker.css">
    <title>Document</title>
</head>

<body>
    <div class="header">
        <h1 id="myH1" class="h1-header">Dojonary</h1>
        <input type="text" placeholder="Search">
        <button id="mySubmit" class="login">Login</button>
    </div>
    <div class="container">
        
        <div class="right">
            <div class="top">
                <h1 class="h1-top">ninja</h1>
                <h2><em>noun</em></h2>
                <h2>Plural:<em>ninjas</em></h2>
                <button class="likes" id="ninjaLike">13 likes</button>
                <div class="span-p">
                    <p>A practitioner skilled in the </p>
                    <label for=""><span class="span-top">Japanese</span> art of <span
                        class="span-top">ninjutsu</span></label>
                    </div>
                </div>
                <div class="Foter">
                    <h1 class="h1-top">ninja</h1>
                    <h2><em>noun</em></h2>
                    <h2>Plural:<em>ninjas</em></h2>
                    <button id="increaseBtn" class="likes">13 likes</button>
                    <div class="span-p">
                    <p>A practitioner skilled in the </p>
                    <label for=""><span class="span-top">Japanese</span> art of <span
                            class="span-top">ninjutsu</span></label>
                </div>
            </div>
        </div>
        <div class="left">
            <p>Dojonary is defined by <strong>You</strong></p>
            <button id="addDefinition" class="btn-letf">Add Definition</button>
        </div>
    </div>
</div>

<script src="Document Object Model 🡲 Button Clicker.js"></script>
</body>

</html>
